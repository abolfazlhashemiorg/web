{% extends 'base.html' %}
{% load static %}

{% block title %}ورود | فروشگاه لوازم جانبی موبایل{% endblock %}

{% block content %}
<div class="container" style="max-width: 450px; margin: 60px auto;">
    <div style="background: white; padding: 35px; border-radius: 20px; box-shadow: 0 2px 15px rgba(0,0,0,0.08);">
        <h2 style="text-align: center; margin-bottom: 25px; color: #1F2937;">🔐 ورود به حساب</h2>
        
        <form method="post" action="/accounts/login/">
            {% csrf_token %}
            
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #374151;">نام کاربری</label>
                <input type="text" name="username" placeholder="نام کاربری خود را وارد کنید" required style="width: 100%; padding: 10px 14px; border: 2px solid #E5E7EB; border-radius: 12px; font-size: 14px;">
            </div>
            
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #374151;">رمز عبور</label>
                <input type="password" name="password" placeholder="رمز عبور خود را وارد کنید" required style="width: 100%; padding: 10px 14px; border: 2px solid #E5E7EB; border-radius: 12px; font-size: 14px;">
            </div>
            
            <button type="submit" style="width: 100%; background: #6366F1; color: white; padding: 12px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer;">
                ورود
            </button>
        </form>
        
        <p style="text-align: center; margin-top: 20px; color: #6B7280;">
            حساب کاربری ندارید؟ 
            <a href="/accounts/register/" style="color: #6366F1; text-decoration: none; font-weight: 600;">ثبت‌نام کنید</a>
        </p>
    </div>
</div>
{% endblock %}
