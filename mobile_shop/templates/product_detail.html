{% extends 'base.html' %}
{% block content %}
<div class="container">
    <div class="product-detail">
        <img src="{{ product.image.url }}" alt="{{ product.name }}">
        <h1>{{ product.name }}</h1>
        <p>{{ product.description }}</p>
        <div class="price">{{ product.final_price }} تومان</div>
        <a href="/add-to-cart/{{ product.id }}/" class="btn-primary">افزودن به سبد خرید</a>
    </div>
</div>
{% endblock %}
